name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2022' && 'msys2 {0}' || 'bash' }}
    env:
      # These are the artifacts users actually install, so the wheels must be
      # built from the committed lockfile rather than a fresh resolution.
      # maturin's PEP 517 backend splits this into the args it passes to
      # `maturin pep517 build-wheel`, which forwards cargo's `--locked`. It has
      # to be repeated inside CIBW_ENVIRONMENT below to reach the container
      # builds, and `build_sdist` ignores it, so the sdist job is unaffected.
      MATURIN_PEP517_ARGS: --locked
    steps:
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-build
            mingw-w64-x86_64-python-maturin
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            diffutils
            m4
            make
            git
            curl
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Build wheels
        if: runner.os != 'Windows'
        run: |
          pipx run cibuildwheel
        env:
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH" CARGO_TERM_COLOR="always" MATURIN_PEP517_ARGS="--locked"'
          CIBW_BEFORE_BUILD: rustup show
          CIBW_BEFORE_BUILD_LINUX: >
            curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain=stable --profile=minimal -y &&
            rustup show
          CIBW_TEST_COMMAND: "pytest -vv {project}"
          CIBW_TEST_REQUIRES: pytest
          CIBW_SKIP: "*_i686 cp39-macosx_x86_64 cp310-macosx_x86_64 cp311-macosx_x86_64"
          CIBW_BUILD_VERBOSITY: 1
      # CIBW has some issues building wheels with MSYS2
      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        run: |
          CC=clang python -m build --wheel --no-isolation --outdir wheelhouse
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ github.event.release.tag_name }}-${{ matrix.os }}
          retention-days: 1
          path: wheelhouse/*.whl

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, make-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/cygv
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-crate:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    # just to make sure both get deployed together
    needs: [build-wheels, make-sdist]
    environment:
      name: crates.io
      url: https://crates.io/crates/cygv
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Publish to Crates.io
        run: |
          cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish
