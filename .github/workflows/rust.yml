name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info makes the build and test binaries 9.8 GB, more than the disk of an arm
  # runner holds; line tables (4.2 GB) still give the file and line of a panic.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2022]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      # The action keys on the job id, the toolchain and the lockfile. Both
      # workflows name their job `build-and-test`, so the extra key keeps this
      # one's dev builds apart from the Python workflow's release builds.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: dev
      # `--locked` fails the build rather than silently re-resolving when
      # `Cargo.lock` is out of date with `Cargo.toml`. Without it a manifest
      # change committed without its lockfile update would be tested against a
      # dependency set that is in nobody's tree, and the cache key above —
      # which hashes the committed lockfile — would not describe what was built.
      - name: Build
        run: cargo build --locked --verbose
      - name: Build without the CLI
        run: cargo build --locked --no-default-features --verbose
      - name: Run tests
        run: cargo test --locked --verbose

  # The pre-commit hooks run rustfmt and clippy locally, but pre-commit.ci skips them,
  # since they need a Rust toolchain.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run clippy on the Python bindings
        run: cargo clippy --locked --no-default-features --features python -- -D warnings
      # The notices that the wheels ship must follow the lockfile.
      - name: Check the third-party licenses
        run: python3 scripts/third_party_licenses.py --check
      - name: Build the documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest toolchain that `rust-version` in Cargo.toml promises. Only checked, not
  # tested: the tests run on stable above, and type checking is what an older compiler
  # rejects.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Read the minimum supported version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check
        run: cargo check --locked --all-targets
      - name: Check the Python bindings
        run: cargo check --locked --no-default-features --features python

  # What `cargo publish` uploads must build on its own, with the files that `exclude` in
  # Cargo.toml leaves in.
  package:
    name: Package the crate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Package and build it
        run: cargo package --locked

  check-rust:
    name: Check Rust
    if: always()
    needs: [build-and-test, lint, msrv, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
