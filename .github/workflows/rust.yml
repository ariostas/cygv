name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      # The action keys on the job id, the toolchain and the lockfile. Both
      # workflows name their job `build-and-test`, so the extra key keeps this
      # one's dev builds apart from the Python workflow's release builds.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: dev
      # `--locked` fails the build rather than silently re-resolving when
      # `Cargo.lock` is out of date with `Cargo.toml`. Without it a manifest
      # change committed without its lockfile update would be tested against a
      # dependency set that is in nobody's tree, and the cache key above —
      # which hashes the committed lockfile — would not describe what was built.
      - name: Build
        run: cargo build --locked --verbose
      - name: Build without the CLI
        run: cargo build --locked --no-default-features --verbose
      - name: Run tests
        run: cargo test --locked --verbose

  check-rust:
    name: Check Rust
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
