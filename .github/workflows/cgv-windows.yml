# Build cgv with MinGW-w64 (MSYS2) on Windows and run its regression tests.
name: cgv (Windows)
on:
  push:
    branches: [cgv, cgv-windows-ci]
    paths: ["cgv/**", ".github/workflows/cgv-windows.yml"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64   # same environment as cygv's own Windows builds
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-numpy
      - name: normaliz (optional; the default cone path needs it)
        id: nmz
        continue-on-error: true
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-normaliz && normaliz --version
      - name: Build (portable flags, as a wheel would use)
        working-directory: cgv
        run: |
          make cgv CFLAGS="-O3 -march=x86-64-v2 -Wall -Wextra -Wno-unused-parameter"
          ls -la cgv.exe
      - name: Regression, full enumeration (no normaliz needed)
        working-directory: cgv/tests
        run: python regress.py --no-cones --max-deg-cap 16 --bin ../cgv.exe
      - name: Regression, default mode (cones from normaliz)
        if: steps.nmz.outcome == 'success'
        working-directory: cgv/tests
        run: python regress.py --max-deg-cap 18 --bin ../cgv.exe
