# modular pipeline, with its original pipeline in exact rationals), for what the threefold
# hypersurfaces of refs.yaml do not cover: an n-fold, GW invariants and target points. The
# expected values are in refs_030_gv.yaml (GW invariants included, as strings), which
# tests/fixtures.rs compares with what this crate computes. cygv 0.3.0 took the semigroup of
# the generators, which here are unimodular, so that it is every lattice point of the cone.
#
# fourfold_* is examples/fourfold.yaml (a complete intersection with h^{1,1} = 6) up to
# degree 4; p11222_* is the resolved P(1,1,2,2,2)[8] of examples/cones.yaml.
