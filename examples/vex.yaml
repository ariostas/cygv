# An example input for the cygv command line interface in a vex phase, with cone data.
#
#   cygv --file examples/vex.yaml
#
# It computes the GV invariants of a CY threefold hypersurface with h^{1,1} = 2 in a vex
# phase of its ambient toric variety, a flop of the resolved P(1,1,2,2,2)[8] (liam_h2_fan1
# of the references of cgv, the C program the modular pipeline reimplements). Its curves of
# negative anticanonical degree that meet the divisors of the stratum negatively carry the
# stratum's term. The cone data, computed with Normaliz, includes the cone K_S of that stratum.
---
name: vex phase of P(1,1,2,2,2)[8]
grading_vector: [2, 1]
q: [[1, 0, -1, 1, 0, 1], [0, 1, 1, 1, 1, 0]]
intnums: [[0, 1, 1, 4], [1, 1, 1, 2]]
max_deg: 10
# The stratum: its three divisors and its class, whose entries may be fractions.
strata:
  - {divisors: [1, 2, 4], class: [1, -1]}
# The inequalities h . C >= 0 of the Mori cone, which is spanned by (0, 1) and (1, -1).
mori_hyperplanes: [[1, 0], [1, 1]]
# The cones K_T of every set T of one or two divisors, and of the stratum.
hilbert_bases:
  - {divisors: [0], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [1], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [2], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [3], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [4], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [5], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [0, 1], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [0, 2], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [0, 3], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [0, 4], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [0, 5], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [1, 2], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [1, 3], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [1, 4], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [1, 5], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [2, 3], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [2, 4], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [2, 5], hilbert_basis: [[0, 1], [1, 0]]}
  - {divisors: [3, 4], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [3, 5], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [4, 5], hilbert_basis: [[0, 1], [1, 1]]}
  - {divisors: [1, 2, 4], hilbert_basis: [[0, 1], [1, -1]]}
