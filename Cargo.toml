[package]
name = "cygv"
version = "0.2.3"
description = "Compute GV and GW invariants of CY manifolds."
authors = ["Andres Rios Tascon"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ariostas/cygv"

[lib]
name = "cygv"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "cygv"
path = "src/bin/cygv/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line interface, i.e. the `cygv` binary and the `io` module. Library
# users that do not need it can depend on this crate with `default-features = false`
# to avoid pulling in the argument and YAML parsers.
cli = ["dep:clap", "dep:yaml-rust2"]

[dependencies]
clap = { version = "4.5.16", features = ["derive"], optional = true }
ctrlc = "3.4.4"
itertools = "0.15.0"
nalgebra = "0.35.0"
rug = "1.25.0"
yaml-rust2 = { version = "0.11", optional = true }

[dependencies.pyo3]
version = "0.29.0"
features = ["abi3-py310"]

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
# Only used by the memory benchmark, to route GMP/MPFR allocations through a
# counting allocator. Must stay compatible with the version `rug` links against.
# The feature list must match `rug`'s exactly (it depends on this crate with
# `default-features = false`): cargo fingerprints feature *names*, so enabling
# `default` here — even though it expands to the same set — would create a second
# build unit and rebuild GMP and MPFR from source a second time.
gmp-mpfr-sys = { version = "1.7", default-features = false, features = [
  "mpc",
  "mpfr",
] }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "memory"
harness = false

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "./docs-header.html" ]
