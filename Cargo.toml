[package]
name = "cygv"
version = "0.3.0"
description = "Compute GV and GW invariants of CY manifolds."
authors = ["Andres Rios Tascon"]
edition = "2021"
# Keep in sync with the newest API used, or the oldest toolchain malachite supports
# (currently 1.90), whichever is newer.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/ariostas/cygv"
readme = "README.md"
# cgv/ is a development oracle (see PLAN.md) and is not part of the crate.
exclude = ["cgv/", "tests/data/", "benches/data/cones/"]
keywords = ["calabi-yau", "string-theory", "gopakumar-vafa", "gromov-witten", "mirror-symmetry"]
categories = ["science", "mathematics", "algorithms"]

[lib]
name = "cygv"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "cygv"
path = "src/bin/cygv/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line interface, i.e. the `cygv` binary and the `io` module. Library
# users that do not need it can depend on this crate with `default-features = false`
# to avoid pulling in the argument and YAML parsers.
cli = ["dep:clap", "dep:yaml-rust2"]
# The Python bindings, i.e. the `python` module. Only the extension module built
# by maturin needs them (see `[tool.maturin]` in pyproject.toml), so plain Rust
# builds do not have to compile pyo3.
python = ["dep:pyo3", "dep:ctrlc"]

[dependencies]
clap = { version = "4.5.16", features = ["derive"], optional = true }
ctrlc = { version = "3.4.4", optional = true }
# The big integers and rationals: the reference pipeline's coefficients, and the CRT lift
# and GW invariants of the modular one. Pure Rust, so no C library has to be built.
# Only integers and rationals are needed, so the floats are left out.
malachite = { version = "0.13", default-features = false, features = ["rationals", "std"] }
nalgebra = "0.35.0"
rayon = "1.12.0"
rustc-hash = "2"
yaml-rust2 = { version = "0.13", optional = true }

[dependencies.pyo3]
version = "0.29.2"
features = ["abi3-py310"]
optional = true

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

# Both benchmarks load their larger models from `benches/data` through the `io`
# module, which is part of the `cli` feature.
[[bench]]
name = "bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "memory"
harness = false
required-features = ["cli"]

[profile.release]
# The hot paths are generic over the coefficient type and spread over several
# modules, so how well they optimize depends on cross-module inlining. With the
# default 16 codegen units that is decided by how unrelated code happens to be
# partitioned, and edits that do not touch the hot loops at all have been seen
# to move the wall clock by ~10% either way. Building as a single unit with LTO
# roughly doubles the release build time, and makes the timings reflect the code.
lto = true
codegen-units = 1

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "./docs-header.html" ]
